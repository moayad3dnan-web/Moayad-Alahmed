<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#181209;
    --panel:#221A10;
    --panel2:#1D160D;
    --line:#3A2C1A;
    --ink:#F2E9DA;
    --ink-soft:#C2A98A;
    --gold:#E3B45C;
    --gold-strong:#C8962A;
    --accent:#8C3A3A;
    --fresh:#3C8F4A;
    --warn:#D69A2D;
    --urgent:#C0392B;
    --card:#2A2013;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{ background:var(--bg); color:var(--ink); font-family:'Cairo',sans-serif; -webkit-tap-highlight-color:transparent; }
  body{ padding-bottom:24px; }
  button{ font-family:'Cairo',sans-serif; cursor:pointer; transition:transform .12s ease; }
  button:active{ transform:scale(0.96); }
  @media (prefers-reduced-motion: reduce){
    button:active{ transform:none; }
  }

  .topbar{
    position:sticky; top:0; z-index:20; background:var(--panel2); border-bottom:1px solid var(--line);
    padding:12px 16px; display:flex; align-items:center; gap:12px; flex-wrap:wrap;
  }
  .brand{ display:flex; align-items:center; gap:10px; flex:none; }
  .brand h1{ font-family:'Aref Ruqaa',serif; font-size:20px; color:var(--gold); }
  .brand .sub{ font-size:11px; color:var(--ink-soft); }
  .clock{ font-size:13px; font-weight:700; color:var(--ink-soft); flex:none; }
  .gear-btn{
    margin-inline-start:auto; flex:none; width:38px; height:38px; border-radius:50%; border:1px solid var(--line);
    background:var(--panel); color:var(--ink-soft); font-size:16px;
  }

  .stats-bar{ display:flex; gap:10px; padding:10px 16px; overflow-x:auto; scrollbar-width:none; }
  .stats-bar::-webkit-scrollbar{ display:none; }
  .stat-chip{ flex:none; background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:8px 14px; text-align:center; min-width:96px; }
  .stat-chip .val{ font-size:18px; font-weight:800; color:var(--gold); }
  .stat-chip.danger .val{ color:var(--urgent); }
  .stat-chip .lbl{ font-size:10.5px; color:var(--ink-soft); font-weight:600; margin-top:2px; }

  .alert-banner{
    position:fixed; top:70px; left:50%; transform:translateX(-50%) translateY(-30px); z-index:40;
    background:var(--fresh); color:#fff; padding:12px 22px; border-radius:14px; font-weight:800; font-size:14px;
    opacity:0; pointer-events:none; transition:transform .3s, opacity .3s; box-shadow:0 10px 26px rgba(0,0,0,0.4);
  }
  .alert-banner.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  .order-list{ display:flex; flex-direction:column; gap:12px; padding:6px 16px 20px; max-width:640px; margin:0 auto; }
  .empty-state{ text-align:center; color:var(--ink-soft); padding:70px 20px; }
  .empty-state .ic{ font-size:48px; margin-bottom:12px; }

  .order-card{
    background:var(--card); border-radius:16px; border:1px solid var(--line); padding:14px;
    box-shadow:0 4px 14px rgba(0,0,0,0.25); display:flex; gap:12px; align-items:stretch;
  }
  .order-card.overdue{ border-color:var(--urgent); box-shadow:0 0 0 1px var(--urgent), 0 4px 18px rgba(192,57,43,0.3); animation:pulse 1.4s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{ opacity:1; } 50%{ opacity:0.88; } }

  .order-timer{
    --pct:0; --ring-color:var(--fresh); width:64px; height:64px; border-radius:50%; flex:none;
    background:conic-gradient(var(--ring-color) calc(var(--pct)*1%), rgba(255,255,255,0.12) 0);
    display:flex; align-items:center; justify-content:center; align-self:flex-start;
  }
  .order-timer .inner{
    width:52px; height:52px; border-radius:50%; background:var(--card); display:flex; flex-direction:column; align-items:center;
    justify-content:center; font-size:12px; font-weight:800; color:var(--ink); line-height:1.15;
  }
  .order-timer .inner .tlabel{ font-size:8px; font-weight:700; color:var(--ink-soft); margin-top:1px; }

  .order-body{ flex:1; min-width:0; }
  .o-top{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:6px; }
  .o-id{ font-weight:800; font-size:17px; }
  .o-type{ font-size:12px; font-weight:700; color:var(--ink-soft); }
  .o-overdue-tag{ font-size:11px; font-weight:800; color:var(--urgent); background:rgba(192,57,43,0.15); border-radius:10px; padding:3px 9px; }

  .o-items{ display:flex; flex-direction:column; gap:4px; margin-bottom:8px; }
  .o-item-row{ font-size:13.5px; font-weight:600; display:flex; gap:6px; }
  .o-item-row .qty{ color:var(--gold); font-weight:800; }

  .o-note{
    font-size:12px; font-weight:700; color:var(--urgent); background:rgba(192,57,43,0.12);
    border:1px solid rgba(192,57,43,0.4); border-radius:10px; padding:6px 10px; margin-bottom:8px;
  }

  .o-actions{ margin-top:6px; }
  .deliver-btn{ width:100%; padding:12px; border-radius:12px; border:none; background:var(--gold); color:#241a05; font-weight:800; font-size:14.5px; }

  .completed-toggle{
    margin:16px 16px 0; padding:10px 16px; border-radius:12px; border:1px dashed var(--line);
    background:var(--panel); color:var(--ink-soft); font-weight:700; font-size:12.5px; width:calc(100% - 32px); max-width:608px; text-align:center;
  }
  .completed-drawer{ display:none; padding:10px 16px 0; max-width:640px; margin:0 auto; }
  .completed-drawer.open{ display:block; }
  .completed-row{
    display:flex; align-items:center; justify-content:space-between; background:var(--panel);
    border:1px solid var(--line); border-radius:10px; padding:8px 12px; font-size:12.5px; color:var(--ink-soft); margin-bottom:8px;
  }
  .completed-row .fast{ color:var(--fresh); font-weight:700; }
  .completed-row .slow{ color:var(--urgent); font-weight:700; }

  /* ---------- settings sheet ---------- */
  .sheet-overlay{ position:fixed; inset:0; background:rgba(10,7,3,0.6); z-index:50; opacity:0; pointer-events:none; transition:opacity .25s; }
  .sheet-overlay.open{ opacity:1; pointer-events:auto; }
  .sheet{
    position:absolute; left:0; right:0; bottom:0; background:var(--panel2); border-radius:20px 20px 0 0;
    max-height:85vh; overflow-y:auto; transform:translateY(100%); transition:transform .3s cubic-bezier(.32,.72,0,1);
    padding:20px 18px 26px;
  }
  .sheet-overlay.open .sheet{ transform:translateY(0); }
  .sheet-handle{ width:38px; height:4px; border-radius:4px; background:var(--line); margin:0 auto 14px; }
  .sheet-title{ display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
  .sheet-title h3{ font-family:'Aref Ruqaa',serif; font-size:20px; color:var(--gold); }
  .close-x{ width:30px; height:30px; border-radius:50%; border:1px solid var(--line); background:transparent; color:var(--ink-soft); }
  .settings-row-label{ font-size:12.5px; font-weight:700; color:var(--ink-soft); display:block; margin:14px 0 8px; }
  .settings-btn{ width:100%; padding:12px; border-radius:12px; border:1px solid var(--line); background:var(--panel); color:var(--ink); font-weight:700; font-size:13.5px; margin-bottom:8px; text-align:right; }
  .settings-btn.danger{ color:var(--urgent); border-color:rgba(192,57,43,0.4); }

  ::-webkit-scrollbar{ height:6px; width:6px; }
  ::-webkit-scrollbar-thumb{ background:var(--line); border-radius:6px; }
  body.pin-locked > *:not(.pin-gate){ display:none !important; }
  .pin-gate{
    position:fixed; inset:0; z-index:200; background:var(--bg);
    display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px;
    font-family:'Cairo',sans-serif;
  }
  .pin-gate h2{ font-family:'Aref Ruqaa',serif; color:var(--gold); font-size:24px; margin-bottom:6px; }
  .pin-gate .sub{ color:var(--ink-soft); font-size:12.5px; margin-bottom:20px; }
  .pin-text-input{
    width:220px; text-align:center; direction:ltr; letter-spacing:10px; font-size:22px; font-weight:800;
    padding:14px 10px; border-radius:14px; border:1px solid var(--line); background:var(--panel);
    color:var(--ink); font-family:'Cairo',sans-serif; outline:none;
  }
  .pin-text-input:focus{ border-color:var(--gold); }
  .pin-error{ color:var(--urgent); font-size:12.5px; font-weight:700; margin-top:10px; display:none; min-height:16px; }
  .pin-debug{ color:var(--ink-soft); font-size:11px; margin-top:8px; }
  .pin-submit{
    margin-top:16px; padding:12px 40px; border-radius:14px; border:none; background:var(--gold);
    color:#241a05; font-weight:800; font-size:14.5px; cursor:pointer; font-family:'Cairo',sans-serif;
  }
</style>

<body class="pin-locked">
<div class="pin-gate">
  <h2>🔒 موزع الطلبات</h2>
  <div class="sub">أدخل رمز الدخول الخاص بالموظفين</div>
  <input type="password" id="pinTextInput" class="pin-text-input" inputmode="numeric" autocomplete="off" maxlength="6" placeholder="••••••">
  <div class="pin-debug" id="pinDebug">عدد الأرقام المكتوبة: 0</div>
  <div class="pin-error" id="pinError">رمز غير صحيح، حاول مرة ثانية</div>
  <button class="pin-submit" id="pinSubmit">دخول</button>
</div>
<script>
(function(){
  // غيّر هذا الرمز لأي رقم تبيه (٦ أرقام بالضبط) — نفس الرمز يفتح كل صفحات الموظفين
  var STAFF_PIN = '201294';
  var STORAGE_KEY = 'diwaniya-staff-pin-ok';

  function unlockNow(){
    document.body.classList.remove('pin-locked');
    var gate = document.querySelector('.pin-gate');
    if(gate) gate.style.display = 'none';
  }

  try{ if(localStorage.getItem(STORAGE_KEY)==='1') unlockNow(); }catch(e){}

  function tryUnlock(){
    try{
      var input = document.getElementById('pinTextInput');
      var err = document.getElementById('pinError');
      var entered = (input && input.value ? input.value : '').replace(/[^0-9]/g, '');
      if(err){
        err.style.display = 'block';
        err.style.color = '#C0392B';
      }
      if(entered === STAFF_PIN){
        try{ localStorage.setItem(STORAGE_KEY, '1'); }catch(e2){}
        if(err){ err.textContent = '✅ تطابق! جاري الفتح...'; err.style.color = '#3C8F4A'; }
        unlockNow();
      } else {
        if(err) err.textContent = 'رمز غير صحيح — كتبت ' + entered.length + ' رقم (المطلوب ' + STAFF_PIN.length + '). القيمة المستلمة: ' + (entered || '(فاضية)');
        if(input){ input.value = ''; input.focus(); }
        var dbg = document.getElementById('pinDebug');
        if(dbg) dbg.textContent = 'عدد الأرقام المكتوبة: 0';
      }
    }catch(fatalErr){
      var err2 = document.getElementById('pinError');
      if(err2){ err2.style.display = 'block'; err2.style.color = '#C0392B'; err2.textContent = 'خطأ برمجي: ' + fatalErr.message; }
    }
  }

  function wireUp(){
    var input = document.getElementById('pinTextInput');
    var btn = document.getElementById('pinSubmit');
    var dbg = document.getElementById('pinDebug');
    if(btn){
      btn.addEventListener('click', tryUnlock);
      btn.addEventListener('touchend', function(e){ e.preventDefault(); tryUnlock(); });
    }
    if(input){
      input.addEventListener('keydown', function(e){ if(e.key==='Enter') tryUnlock(); });
      input.addEventListener('input', function(){
        var err = document.getElementById('pinError');
        if(err) err.style.display = 'none';
        if(dbg) dbg.textContent = 'عدد الأرقام المكتوبة: ' + input.value.replace(/[^0-9]/g,'').length;
      });
      setTimeout(function(){ input.focus(); }, 100);
    }
  }
  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', wireUp);
  } else {
    wireUp();
  }
})();
</script>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, doc, setDoc, getDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
  import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged, updateProfile, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyASZzpHN3naZ3UxlRGS-VaDiNZV4-upmzA",
    authDomain: "professional-restaurant-system.firebaseapp.com",
    projectId: "professional-restaurant-system",
    storageBucket: "professional-restaurant-system.firebasestorage.app",
    messagingSenderId: "809714960687",
    appId: "1:809714960687:web:649fc13dd48972052139da",
    measurementId: "G-397FXE7298"
  };

  const fbApp = initializeApp(firebaseConfig);
  const db = getFirestore(fbApp);
  const auth = getAuth(fbApp);
  const ordersDocRef = doc(db, 'diwaniya', 'liveOrders');

  window.diwaniyaOrdersSync.save = function(orders){
    return setDoc(ordersDocRef, { orders, updatedAt: Date.now() })
      .then(() => true)
      .catch((e) => { console.warn('Firestore save failed:', e); return false; });
  };

  onSnapshot(ordersDocRef, (snap) => {
    if(!snap.exists()) return;
    const orders = snap.data().orders || [];
    if(window.diwaniyaOrdersSync.onUpdate) window.diwaniyaOrdersSync.onUpdate(orders);
    (window.diwaniyaOrdersSync._subscribers || []).forEach((cb) => { try{ cb(orders); }catch(e){} });
  }, (err) => console.warn('Firestore live sync error:', err));

  // ---------- real customer authentication ----------
  // Phone + password is what the customer sees; under the hood we map the phone
  // number to a synthetic email address, since Firebase's simplest, free sign-in
  // method (Email/Password) is email-based. This gives real, verifiable accounts
  // that work the same on any device — not just the one that created them.
  // Phone + password is what the customer sees. Under the hood, Firebase's
  // Email/Password sign-in needs a real email address to work with — so if the
  // customer gave us one at signup, we use THAT as their real account email
  // (which also makes "forgot password" work, since Firebase can only email a
  // reset link to an account's real registered email). If they skipped the
  // optional email field, we fall back to a synthetic address built from their
  // phone number — login still works fine, password reset just can't, since
  // there's no real inbox behind it.
  function syntheticEmail(phone){
    const digits = String(phone).replace(/[^0-9]/g, '');
    return digits + '@diwaniya-customer.app';
  }
  function normalizePhone(phone){
    return String(phone).replace(/[^0-9]/g, '');
  }
  function phoneIndexRef(phone){
    return doc(db, 'phoneIndex', normalizePhone(phone));
  }

  window.diwaniyaAuth.signUp = async function(phone, password, name, email){
    const authEmail = (email && email.trim()) ? email.trim() : syntheticEmail(phone);
    const cred = await createUserWithEmailAndPassword(auth, authEmail, password);
    await updateProfile(cred.user, { displayName: name });
    await setDoc(doc(db, 'users', cred.user.uid), { name, phone, email: email || null, authEmail, createdAt: Date.now() });
    await setDoc(phoneIndexRef(phone), { authEmail, uid: cred.user.uid });
    return { uid: cred.user.uid, name, phone, email: email || null };
  };
  window.diwaniyaAuth.signIn = async function(phone, password){
    let authEmail = syntheticEmail(phone);
    try{
      const idxSnap = await getDoc(phoneIndexRef(phone));
      if(idxSnap.exists()) authEmail = idxSnap.data().authEmail;
    }catch(e){}
    const cred = await signInWithEmailAndPassword(auth, authEmail, password);
    const snap = await getDoc(doc(db, 'users', cred.user.uid));
    const data = snap.exists() ? snap.data() : { name: cred.user.displayName || 'زبون', phone };
    return { uid: cred.user.uid, name: data.name, phone: data.phone || phone, email: data.email || null };
  };
  window.diwaniyaAuth.signOutUser = async function(){
    await signOut(auth);
  };
  window.diwaniyaAuth.resetPassword = async function(phone){
    const idxSnap = await getDoc(phoneIndexRef(phone));
    if(!idxSnap.exists()){
      const err = new Error('no account found for this phone'); err.code = 'diwaniya/no-account'; throw err;
    }
    const { authEmail } = idxSnap.data();
    if(!authEmail || authEmail.endsWith('@diwaniya-customer.app')){
      const err = new Error('no real email on file'); err.code = 'diwaniya/no-email'; throw err;
    }
    await sendPasswordResetEmail(auth, authEmail);
    return true;
  };

  onAuthStateChanged(auth, async (user) => {
    if(!window.diwaniyaAuth.onReady) return;
    if(!user){ window.diwaniyaAuth.onReady(null); return; }
    try{
      const snap = await getDoc(doc(db, 'users', user.uid));
      const data = snap.exists() ? snap.data() : { name: user.displayName || 'زبون', phone: '' };
      window.diwaniyaAuth.onReady({ uid: user.uid, name: data.name, phone: data.phone, email: data.email || null });
    }catch(e){
      window.diwaniyaAuth.onReady(null);
    }
  });
</script>

  const NUM_KEY = 'diwaniya-kitchen-ordernum-v1';

  function loadOrders(){
    try{ const raw = localStorage.getItem(STORE_KEY); if(raw) return JSON.parse(raw); }catch(e){}
    return null;
  }
  function saveOrders(){
    try{ localStorage.setItem(STORE_KEY, JSON.stringify(orders)); }catch(e){}
    if(window.diwaniyaOrdersSync) window.diwaniyaOrdersSync.save(orders);
  }
  function nextOrderNumber(){
    let n = 101;
    try{ n = parseInt(localStorage.getItem(NUM_KEY) || '101', 10); }catch(e){}
    try{ localStorage.setItem(NUM_KEY, String(n+1)); }catch(e){}
    return n;
  }

  function makeItem(name, qty, note){
    const catalog = MENU_ITEMS.find(m => m.name === name);
    return { id:'it-'+Math.random().toString(36).slice(2,9), name, qty:qty||1, station: catalog?catalog.station:'grill', note:note||'', ready:true };
  }

  function seedDemoOrders(){
    const now = Date.now();
    return [
      // fresh — just became ready
      { id:'ord-1', number:101, type:'dine-in', table:4, status:'preparing',
        items:[ makeItem('مندي لحم',2), makeItem('سلطة دقوس',2), makeItem('لبن بارد',2) ].map(it=>({...it, ready:false})),
        note:'', priority:false, createdAt: now - 6*60000, startedAt: now - 5*60000, readyAt:null, completedAt:null },
      // ready just now (fresh, green)
      { id:'ord-2', number:102, type:'takeaway', table:null, status:'ready',
        items:[ makeItem('صحن مشكل مشاوي (وسط)',1), makeItem('حمص بزيت الزيتون والصنوبر',1), makeItem('شاي مثلج',2) ],
        note:'حساسية من المكسرات', priority:false, createdAt: now - 8*60000, startedAt: now - 7*60000, readyAt: now - 30000, completedAt:null },
      // ready ~2 min ago (amber warning zone)
      { id:'ord-3', number:103, type:'delivery', table:null, status:'ready',
        items:[ makeItem('كبسة دجاج',3), makeItem('زبادي بالخيار',3), makeItem('عصير برتقال طازج',3) ],
        note:'', priority:false, createdAt: now - 12*60000, startedAt: now - 11*60000, readyAt: now - 2*60000, completedAt:null },
      // ready ~4 min ago (overdue, red, past the 3-minute target)
      { id:'ord-4', number:104, type:'dine-in', table:9, status:'ready',
        items:[ makeItem('سمبوسة لحم',4), makeItem('قهوة عربية',2), makeItem('لقيمات',2) ],
        note:'', priority:false, createdAt: now - 20*60000, startedAt: now - 19*60000, readyAt: now - 4*60000, completedAt:null },
      // already delivered earlier today
      { id:'ord-5', number:100, type:'dine-in', table:2, status:'completed',
        items:[ makeItem('مندي دجاج',2), makeItem('سلطة خليجية بالطحينة',2) ],
        note:'', priority:false, createdAt: now - 40*60000, startedAt: now - 39*60000, readyAt: now - 30*60000, completedAt: now - 28*60000 },
    ];
  }

  let orders = loadOrders();
  if(!orders || !orders.length){ orders = seedDemoOrders(); saveOrders(); }

  const alertBanner = document.getElementById('alertBanner');

  // ---------- clock ----------
  function tickClock(){
    document.getElementById('clockText').textContent = new Date().toLocaleTimeString('ar-SA', {hour:'2-digit', minute:'2-digit', second:'2-digit'});
  }
  setInterval(tickClock, 1000); tickClock();

  // ---------- time helpers ----------
  function elapsedMinSec(fromTs){
    const diff = Math.max(0, Date.now() - fromTs);
    const totalSec = Math.floor(diff/1000);
    return { m: Math.floor(totalSec/60), s: totalSec % 60, totalMin: diff/60000 };
  }
  function fmtTime(m,s){ return String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0'); }
  function urgencyBucket(totalMin){
    if(totalMin < THRESHOLDS.fresh) return 'fresh';
    if(totalMin < THRESHOLDS.warn) return 'warn';
    return 'urgent';
  }
  const BUCKET_COLOR = {fresh:'var(--fresh)', warn:'var(--warn)', urgent:'var(--urgent)'};

  // ---------- data ----------
  function readyOrders(){
    return orders.filter(o => o.status==='ready').sort((a,b) => (a.readyAt||a.createdAt) - (b.readyAt||b.createdAt));
  }
  function completedToday(){
    const todayStart = new Date(); todayStart.setHours(0,0,0,0);
    return orders.filter(o => o.status==='completed' && o.createdAt >= todayStart.getTime())
      .sort((a,b) => b.completedAt - a.completedAt);
  }

  function orderCardHtml(o){
    const type = TYPE_MAP[o.type];
    const base = o.readyAt || o.createdAt;
    const totalMin = elapsedMinSec(base).totalMin;
    const isOverdue = totalMin >= THRESHOLDS.warn;
    const itemsHtml = o.items.map(it => `<div class="o-item-row"><span class="qty">${it.qty}x</span>${it.name}</div>`).join('');
    return `
      <div class="order-card ${isOverdue?'overdue':''}" data-order="${o.id}">
        <div class="order-timer" data-ring data-base="${base}">
          <div class="inner"><span data-ring-text>00:00</span><span class="tlabel">هدف ${DELIVER_TARGET_MIN} د</span></div>
        </div>
        <div class="order-body">
          <div class="o-top">
            <div class="o-id">#${o.number}</div>
            <div class="o-type">${type.icon} ${type.label}${o.table?' · طاولة '+o.table:''}</div>
          </div>
          ${isOverdue ? `<div class="o-overdue-tag">⏰ تجاوز وقت التسليم المستهدف</div>` : ''}
          <div class="o-items">${itemsHtml}</div>
          ${o.note ? `<div class="o-note">⚠️ ${o.note}</div>` : ''}
          <div class="o-actions">
            <button class="deliver-btn" data-deliver="${o.id}">✅ تم التسليم</button>
          </div>
        </div>
      </div>`;
  }

  function renderOrders(){
    const list = readyOrders();
    const listEl = document.getElementById('orderList');
    if(!list.length){
      listEl.innerHTML = `<div class="empty-state"><div class="ic">🍽️</div>لا توجد طلبات جاهزة للتسليم الآن</div>`;
    } else {
      listEl.innerHTML = list.map(orderCardHtml).join('');
    }
    listEl.querySelectorAll('[data-deliver]').forEach(btn => {
      btn.addEventListener('click', () => markDelivered(btn.dataset.deliver));
    });
    updateTimers();
  }

  function markDelivered(orderId){
    const o = orders.find(x => x.id===orderId);
    if(!o) return;
    o.status = 'completed';
    o.completedAt = Date.now();
    saveOrders();
    renderAll();
  }

  function updateTimers(){
    document.querySelectorAll('[data-ring]').forEach(ring => {
      const base = parseInt(ring.dataset.base, 10);
      const {m, s, totalMin} = elapsedMinSec(base);
      const bucket = urgencyBucket(totalMin);
      const pct = Math.min(100, (totalMin / THRESHOLDS.warn) * 100);
      ring.style.setProperty('--pct', pct.toFixed(0));
      ring.style.setProperty('--ring-color', BUCKET_COLOR[bucket]);
      const textEl = ring.querySelector('[data-ring-text]');
      if(textEl) textEl.textContent = fmtTime(m,s);
      const card = ring.closest('.order-card');
      if(card && bucket==='urgent') card.classList.add('overdue');
    });
  }
  setInterval(updateTimers, 1000);

  function renderStats(){
    const list = readyOrders();
    const overdueCount = list.filter(o => elapsedMinSec(o.readyAt||o.createdAt).totalMin >= THRESHOLDS.warn).length;
    const todaysCompleted = completedToday().filter(o => o.readyAt && o.completedAt);
    let avgDeliverSec = 0;
    if(todaysCompleted.length){
      const sum = todaysCompleted.reduce((a,o) => a + (o.completedAt - o.readyAt), 0);
      avgDeliverSec = Math.round(sum / todaysCompleted.length / 1000);
    }
    const stats = [
      {val: list.length, lbl:'طلبات جاهزة'},
      {val: overdueCount, lbl:'متأخرة ⏰', danger:true},
      {val: avgDeliverSec ? (Math.floor(avgDeliverSec/60)+':'+String(avgDeliverSec%60).padStart(2,'0')) : '--:--', lbl:'متوسط وقت التسليم'},
      {val: todaysCompleted.length, lbl:'تم تسليمها اليوم'},
    ];
    document.getElementById('statsBar').innerHTML = stats.map(s => `<div class="stat-chip ${s.danger&&s.val>0?'danger':''}"><div class="val">${s.val}</div><div class="lbl">${s.lbl}</div></div>`).join('');
  }

  function renderCompletedDrawer(){
    const list = completedToday();
    document.getElementById('completedCount').textContent = list.length;
    document.getElementById('completedDrawer').innerHTML = list.length ? list.map(o => {
      const type = TYPE_MAP[o.type];
      const deliverSec = o.readyAt && o.completedAt ? Math.round((o.completedAt-o.readyAt)/1000) : null;
      const deliverText = deliverSec!==null ? (Math.floor(deliverSec/60)+':'+String(deliverSec%60).padStart(2,'0')) : '-';
      const cls = deliverSec!==null && deliverSec <= DELIVER_TARGET_MIN*60 ? 'fast' : 'slow';
      return `<div class="completed-row"><span>#${o.number} · ${type.icon} ${type.label}</span><span class="${cls}">تسليم ${deliverText}</span></div>`;
    }).join('') : `<div class="empty-state" style="padding:20px;">لا توجد طلبات مسلّمة اليوم بعد</div>`;
  }
  document.getElementById('completedToggleBtn').addEventListener('click', () => {
    document.getElementById('completedDrawer').classList.toggle('open');
  });

  function renderAll(){ renderOrders(); renderStats(); renderCompletedDrawer(); }

  // ---------- new-ready alert ----------
  let knownReadyIds = new Set();
  function checkForNewReady(){
    const list = readyOrders();
    const currentIds = new Set(list.map(o => o.id));
    let hasNew = false;
    currentIds.forEach(id => { if(!knownReadyIds.has(id)) hasNew = true; });
    if(hasNew){ flashAlert('🔔 طلب جديد جاهز للتسليم!'); renderAll(); }
    knownReadyIds = currentIds;
  }
  setInterval(checkForNewReady, 2500);

  let alertTimer = null;
  function flashAlert(msg){
    alertBanner.textContent = msg;
    alertBanner.classList.add('show');
    playBeep();
    clearTimeout(alertTimer);
    alertTimer = setTimeout(() => alertBanner.classList.remove('show'), 3200);
  }
  function playBeep(){
    try{
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator(); const gain = ctx.createGain();
      osc.type = 'sine'; osc.frequency.value = 660;
      gain.gain.setValueAtTime(0.15, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(); osc.stop(ctx.currentTime + 0.5);
    }catch(e){}
  }

  // ---------- settings sheet ----------
  const settingsOverlay = document.getElementById('settingsOverlay');
  function openSettings(){ settingsOverlay.classList.add('open'); }
  function closeSettings(){ settingsOverlay.classList.remove('open'); }
  document.getElementById('gearBtn').addEventListener('click', openSettings);
  document.getElementById('settingsCloseX').addEventListener('click', closeSettings);
  settingsOverlay.addEventListener('click', (e) => { if(e.target===settingsOverlay) closeSettings(); });

  document.getElementById('addTestReadyBtn').addEventListener('click', () => {
    const pool = MENU_ITEMS[Math.floor(Math.random()*MENU_ITEMS.length)];
    const order = {
      id:'ord-'+Date.now()+'-'+Math.random().toString(36).slice(2,6),
      number: nextOrderNumber(), type:'dine-in', table: Math.ceil(Math.random()*12), status:'ready',
      items:[ makeItem(pool.name, Math.ceil(Math.random()*3)) ],
      note:'', priority:false, createdAt: Date.now()-4*60000, startedAt: Date.now()-3*60000, readyAt: Date.now(), completedAt:null,
    };
    orders.push(order);
    saveOrders();
    closeSettings();
    renderAll();
    flashAlert(`🔔 طلب تجريبي #${order.number} جاهز للتسليم!`);
  });
  document.getElementById('clearAllBtn').addEventListener('click', () => {
    orders = seedDemoOrders();
    saveOrders();
    closeSettings();
    renderAll();
  });
  document.getElementById('lockScreenBtn').addEventListener('click', () => {
    try{ localStorage.removeItem('diwaniya-staff-pin-ok'); }catch(e){}
    location.reload();
  });

  // ---------- init ----------
  knownReadyIds = new Set(readyOrders().map(o => o.id));
  renderAll();

  window.diwaniyaOrdersSync.onUpdate = function(remoteOrders){
    orders = remoteOrders;
    try{ localStorage.setItem(STORE_KEY, JSON.stringify(orders)); }catch(e){}
    renderAll();
  };
})();
</script>
</body>
</html>
